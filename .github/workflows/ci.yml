name: CI

# Run on every push to any branch, and on every pull request targeting main.
# This catches broken builds before they reach main.
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21 (Temurin = Eclipse Adoptium — same JDK used locally)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cache the Maven local repository (~/.m2).
      #    On repeat runs, dependencies are restored from cache instead of
      #    re-downloaded from Maven Central — saves ~2 min per run.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Ensure Maven wrapper has execution permissions on Linux
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # 5. Run the full build + test suite.
      #    'verify' = compile + test + integration-test.
      #    Testcontainers will start a real Postgres Docker container automatically
      #    (Docker is available on GitHub Actions ubuntu runners).
      #    JWT_SECRET is provided as an env var — the app refuses to start without it.
      - name: Build and test
        run: ./mvnw verify
        env:
          JWT_SECRET: ci-test-secret-32-bytes-minimum!!
