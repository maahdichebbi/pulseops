# Active when: spring.profiles.active=local
# Use this profile for local development with Docker Compose.
# Never commit real secrets here — only localhost defaults.

spring:
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  jwt:
    # Local-only placeholder. Override with a real secret in production.
    secret: local-dev-secret-do-not-use-in-production-min-32-chars
