spring:
  application:
    name: pulseops

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseops}
    username: ${DB_USER:pulseops}
    password: ${DB_PASSWORD:pulseops}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    open-in-view: false         # Prevents lazy-load surprises across the web layer
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# JWT secret — always supplied via environment variable; never hard-coded here
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

logging:
  level:
    com.pulseops: DEBUG
    org.flywaydb: INFO
